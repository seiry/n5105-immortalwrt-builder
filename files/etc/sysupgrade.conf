## This file contains files and directories that should
## be preserved during an upgrade.

# /etc/example.conf
# /etc/openvpn/

# This file is not in any keep.d list, so without this line the upgrade that
# uses it is also the one that throws it away.
/etc/sysupgrade.conf

# nikki runtime state. keep.d/nikki only lists the profile, the subscriptions
# and two provider subdirs, so everything below is lost on upgrade otherwise.
/etc/nikki/run/cache.db
/etc/nikki/run/providers/
/etc/nikki/run/ruleset/
/etc/nikki/run/ui/

# Public keys for third-party apk feeds. No keep.d list covers this directory.
/etc/apk/keys/
